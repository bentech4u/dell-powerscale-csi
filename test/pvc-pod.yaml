apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: isilon-test
  namespace: isilon
spec:
  accessModes: [ReadWriteMany]
  storageClassName: isilon
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: isilon-test
  namespace: isilon
spec:
  containers:
    - name: shell
      image: registry.access.redhat.com/ubi9/ubi-minimal
      command: ["sh", "-c", "echo hello-from-$(hostname) > /data/hello.txt && cat /data/hello.txt && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: isilon-test
